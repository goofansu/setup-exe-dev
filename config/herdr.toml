onboarding = false

[ui]
agent_panel_sort = "priority"
pane_gaps = false

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "terminal_title_stripped"],
]

[keys]
prefix = "ctrl+space"
settings = "prefix+comma"
last_pane = "prefix+l"
split_horizontal = "prefix+h"
open_worktree = "prefix+ctrl+o"

# Navigation
## Sidebar - Workspace
switch_workspace = "prefix+1..9"
previous_workspace = "ctrl+alt+k"
next_workspace = "ctrl+alt+j"

## Sidebar - Agent
focus_agent = "prefix+alt+1..9"
previous_agent = "ctrl+alt+shift+k"
next_agent = "ctrl+alt+shift+j"

## Tab
switch_tab = "alt+1..9"
previous_tab = "ctrl+alt+["
next_tab = "ctrl+alt+]"
move_tab_previous = "ctrl+alt+shift+["
move_tab_next = "ctrl+alt+shift+]"

## Pane
focus_pane_left = "ctrl+alt+left"
focus_pane_right = "ctrl+alt+right"
focus_pane_up = "ctrl+alt+up"
focus_pane_down = "ctrl+alt+down"
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_right = "ctrl+alt+shift+right"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_down = "ctrl+alt+shift+down"
